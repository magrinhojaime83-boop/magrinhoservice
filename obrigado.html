<script id="msResponsiveNavigation">
(function(){
  const HASH='8aff127e219d4b26bafc8f8c45f55f030938dbc5fe799873cf18fc95a4aec5b1';
  const KEY='magrinhoservice_admin_code';
  async function hash(v){const d=new TextEncoder().encode(v);const b=await crypto.subtle.digest('SHA-256',d);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
  async function validAdmin(){
    let code='';
    const m=location.hash.match(/^#admin=(.+)$/);
    if(m){try{code=decodeURIComponent(m[1])}catch(e){code=''};if(code && await hash(code)===HASH){sessionStorage.setItem(KEY,code);const u=new URL(location.href);u.hash='';u.searchParams.set('adminmode','1');history.replaceState(null,'',u.pathname+u.search);}else code='';}
    if(!code)code=sessionStorage.getItem(KEY)||'';
    return !!code && await hash(code)===HASH;
  }
  function makeAdminLink(){const a=document.createElement('a');a.href='administrador.html?adminmode=1';a.textContent='Administrador';a.className='ms-admin-only-link';return a;}
  async function mountAdmin(){
    const desktop=document.getElementById('msDesktopAdminSlot');
    const mobile=document.getElementById('msMobileAdminSlot');
    if(desktop)desktop.replaceChildren(); if(mobile)mobile.replaceChildren();
    if(await validAdmin()){if(desktop)desktop.appendChild(makeAdminLink());if(mobile)mobile.appendChild(makeAdminLink());}
  }
  window.msOpenMobileMenu=function(){const m=document.getElementById('msMobileMenu');if(!m)return;m.classList.add('open');m.setAttribute('aria-hidden','false');document.body.classList.add('ms-menu-open');};
  window.msCloseMobileMenu=function(){const m=document.getElementById('msMobileMenu');if(!m)return;m.classList.remove('open');m.setAttribute('aria-hidden','true');document.body.classList.remove('ms-menu-open');};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')window.msCloseMobileMenu();});
  document.querySelectorAll('#msMobileMenu a').forEach(a=>a.addEventListener('click',window.msCloseMobileMenu));
  mountAdmin();
})();
</script>
